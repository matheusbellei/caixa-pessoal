<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa Pessoal</title>
<meta name="theme-color" content="#F5EBDD">
<script>
/* Aplica o tema antes de desenhar, para não piscar claro no modo escuro */
(function(){ try{ var t = localStorage.getItem("caixa-tema") || "auto";
  var e = t === "escuro" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.tema = e ? "escuro" : "claro"; }catch(x){} })();
</script>
<meta name="description" content="Guarde links, documentos, ideias e prints organizados em colunas.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. ESTILOS — paleta café (mesma do Controle de Finanças)
   ===================================================================== */
:root{
  --espresso:#3B2416; --mocha:#6F4E37; --caramelo:#C68B59; --latte:#E8D3B9;
  --creme:#F5EBDD; --espuma:#FBF6EF; --oliva:#5B7A3A; --terracota:#B5543A;
  --texto:#3B2416; --texto-2:#7A6352; --borda:#E8D3B9;
  --raio:16px; --raio-p:10px;
  --sombra:0 1px 2px rgba(59,36,22,.06),0 2px 8px rgba(59,36,22,.05);
  --campo:#fff; --veu:rgba(59,36,22,.4); --veu-menu:rgba(59,36,22,.35);
  --hover-sec:#dfc6a7; --hover-perigo:#f6e1d9; --img-fundo:#efe2d1; --coluna:rgba(232,211,185,.45);
  --placeholder:#a58e7b; color-scheme:light;
}
/* Modo escuro "café torrado" */
html[data-tema="escuro"]{
  --espresso:#F1E4D3; --mocha:#D7B48F; --caramelo:#D39A66; --latte:#3E2E23;
  --creme:#17100B; --espuma:#241912; --oliva:#8DAF6A; --terracota:#E07A5F;
  --texto:#F1E4D3; --texto-2:#B39D8A; --borda:#3E2E23;
  --sombra:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25);
  --campo:#1D140E; --veu:rgba(0,0,0,.6); --veu-menu:rgba(0,0,0,.5);
  --hover-sec:#4C392B; --hover-perigo:#3A1F18; --img-fundo:#120C08; --coluna:rgba(62,46,35,.55);
  --placeholder:#8C7663; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",system-ui,-apple-system,sans-serif;background:var(--creme);color:var(--texto);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--mocha)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
.hidden{display:none!important}

/* Topo */
.topo{position:sticky;top:0;z-index:20;background:var(--creme);display:flex;align-items:center;gap:6px;padding:10px 14px}
.topo h1{font-size:19px;font-weight:700;margin:0 auto 0 4px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.topo h1 small{font-size:12px;font-weight:500;color:var(--texto-2)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--espresso)}
.ib:hover{background:var(--latte)}
.busca{flex:1;display:flex;align-items:center;gap:8px;background:var(--espuma);border:1px solid var(--borda);border-radius:12px;padding:0 10px;height:40px}
.busca input{flex:1;border:0;background:none;outline:none;min-width:0}

/* Menu lateral */
.veu{position:fixed;inset:0;background:var(--veu-menu);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:85vw;background:var(--espuma);z-index:41;transform:translateX(-100%);transition:transform .22s ease;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.menu.on{transform:none}
.menu .marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:6px 10px 16px}
.menu a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--espresso);font-weight:500}
.menu a:hover{background:var(--creme)}
.menu a.on{background:var(--latte)}
.menu .rodape{margin-top:auto;font-size:12px;color:var(--texto-2);padding:10px 12px}

main{padding:0 14px 40px;max-width:100%}
.pagina{max-width:760px;margin:0 auto}
.pagina h2{font-size:22px;margin:8px 0 4px}
.pagina p.sub{color:var(--texto-2);margin:0 0 16px}

/* Captura rápida */
.captura{background:var(--espuma);border:1px solid var(--borda);border-radius:var(--raio);padding:12px;box-shadow:var(--sombra);max-width:880px;margin:4px auto 14px;transition:border-color .15s,box-shadow .15s}
.captura.foco{border-color:var(--caramelo);box-shadow:0 0 0 3px rgba(198,139,89,.18)}
.captura.arrastando{border-style:dashed;border-color:var(--mocha);background:var(--campo)}
.captura textarea{width:100%;border:0;outline:none;background:none;resize:none;font-size:16px;min-height:26px;max-height:200px;padding:2px 4px}
.captura textarea::placeholder{color:var(--placeholder)}
/* Título e descrição opcionais (aparecem pelo botão "T") */
.captura:not(.detalhes) .cap-extra{display:none}
.captura .cap-extra{display:block;width:100%;border:0;outline:none;background:none;padding:2px 4px}
.captura .cap-tit{font-weight:600;font-size:16px;padding-bottom:7px;margin-bottom:6px;border-bottom:1px dashed var(--borda)}
.captura .cap-desc{font-size:14px;color:var(--texto-2);min-height:22px;max-height:140px;margin-top:6px;padding-top:7px;border-top:1px dashed var(--borda)}
@media(pointer:coarse){.captura .cap-desc{font-size:16px}}
.captura .cap-extra::placeholder{color:var(--placeholder);font-weight:400}
.ib.on{background:var(--latte)}
.juntar{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--texto-2);padding:4px 6px;border-radius:8px;cursor:pointer;align-self:center}
.juntar input{width:15px;height:15px;accent-color:var(--espresso);margin:0}
.pendentes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.pend{position:relative;display:flex;align-items:center;gap:8px;background:var(--creme);border-radius:10px;padding:6px 30px 6px 6px;max-width:220px;font-size:13px}
.pend img{width:40px;height:40px;object-fit:cover;border-radius:7px}
.pend .ext{width:40px;height:40px;border-radius:7px;background:var(--latte);display:grid;place-items:center;font-size:11px;font-weight:700;text-transform:uppercase}
.pend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.pend button:hover{background:var(--latte)}
.barra{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.barra .destino{font-size:12.5px;color:var(--texto-2);margin-left:4px;align-self:center;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 11px;border-radius:999px;background:var(--creme);font-size:13px;font-weight:500;border:1px solid transparent}
.chip:hover{border-color:var(--latte)}
.chip.on{background:var(--espresso);color:var(--espuma)}
.chip .bola{width:8px;height:8px;border-radius:50%}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;white-space:nowrap}
.bt.pri{background:var(--espresso);color:var(--espuma)}
.bt.pri:hover{background:var(--mocha)}
.bt.pri:disabled{opacity:.45;cursor:default}
.bt.sec{background:var(--latte);color:var(--espresso)}
.bt.sec:hover{background:var(--hover-sec)}
.bt.leve{background:transparent;color:var(--espresso)}
.bt.leve:hover{background:var(--creme)}
.bt.perigo{background:transparent;color:var(--terracota)}
.bt.perigo:hover{background:var(--hover-perigo)}
.bt.pq{height:34px;padding:0 12px;font-size:13.5px}
.dica{font-size:12px;color:var(--texto-2);text-align:center;margin:-6px 0 12px}

/* Filtros de tag */
.filtros{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:880px;margin:0 auto 12px;padding:0 2px}
.filtros::-webkit-scrollbar{display:none}
.filtros .chip{background:transparent;border-color:var(--latte)}
.filtros .chip.on{background:var(--mocha);color:var(--espuma);border-color:var(--mocha)}

/* Quadro de colunas */
.quadro{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 16px;align-items:flex-start;-webkit-overflow-scrolling:touch}
.coluna{flex:0 0 86vw;max-width:340px;scroll-snap-align:start;background:var(--coluna);border-radius:var(--raio);padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 150px);min-height:160px}
@media(min-width:760px){.coluna{flex:0 0 300px}}
@media(min-width:1280px){.quadro.ajusta .coluna{flex:1 1 0;max-width:none;min-width:260px}}
.col-topo{display:flex;align-items:center;gap:8px;padding:2px 2px 10px}
.col-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.col-topo h3{margin:0;font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-topo .n{font-size:12px;color:var(--texto-2);font-weight:600;background:var(--espuma);border-radius:8px;padding:2px 7px}
.col-topo .ib{width:32px;height:32px;border-radius:9px}
.col-lista{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px;min-height:60px;flex:1;border-radius:12px;transition:background .15s}
.col-lista.alvo{background:rgba(198,139,89,.18)}
.vazio{font-size:13px;color:var(--texto-2);text-align:center;padding:18px 10px;border:1.5px dashed var(--latte);border-radius:12px}
.marcador{height:3px;border-radius:3px;background:var(--caramelo);margin:-2px 4px}

/* Cartões */
.cartao{background:var(--espuma);border-radius:12px;box-shadow:var(--sombra);padding:10px 12px;cursor:pointer;position:relative;border:1px solid transparent;transition:border-color .12s,transform .12s}
.cartao:hover{border-color:var(--latte)}
.cartao.arrastado{opacity:.4}
.cartao .tit{font-weight:600;font-size:14.5px;word-break:break-word}
.cartao .txt{font-size:14px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.cartao .nota{font-size:13px;color:var(--texto-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.cartao .thumb{margin:-10px -12px 8px;border-radius:12px 12px 0 0;overflow:hidden;background:var(--latte);aspect-ratio:16/10;display:grid;place-items:center}
.cartao .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cartao .thumb:has(+ .rodape-c:empty){margin-bottom:-10px;border-radius:12px}
.cartao .thumb.g2,.cartao .thumb.g3,.cartao .thumb.g4{display:grid;gap:2px;place-items:stretch;background:var(--espuma);grid-template-rows:1fr}
.cartao .thumb.g2{grid-template-columns:1fr 1fr}
.cartao .thumb.g3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.cartao .thumb.g3>div:first-child{grid-row:span 2}
.cartao .thumb.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.cartao .thumb>div{position:relative;overflow:hidden;background:var(--latte);min-height:0}
.cartao .thumb .mais{position:absolute;inset:0;display:grid;place-items:center;background:rgba(59,36,22,.55);color:#fff;font-weight:700;font-size:18px}
.mini-arq{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--texto-2);margin-top:6px;min-width:0}
.mini-arq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-link{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;text-transform:uppercase;font-size:14px}
.linha-link .meio{min-width:0;flex:1}
.linha-link .host{font-size:12px;color:var(--texto-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-link .tit{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abrir{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mocha);flex:none}
.abrir:hover{background:var(--latte)}
.arquivo-ext{width:34px;height:34px;border-radius:9px;background:var(--latte);display:grid;place-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--espresso);flex:none}
.rodape-c{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.rodape-c:empty{display:none}
.tag{font-size:11.5px;background:var(--latte);color:var(--espresso);border-radius:6px;padding:1px 7px;font-weight:500}
.fixo{position:absolute;top:8px;right:8px;color:var(--caramelo)}
.cartao.tem-fixo .tit,.cartao.tem-fixo .txt{padding-right:18px}

/* Janela (painel que sobe no celular / janela no computador) */
.janela-fundo{position:fixed;inset:0;background:var(--veu);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.janela{background:var(--espuma);width:100%;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px 20px;animation:sobe .2s ease}
@media(min-width:700px){.janela-fundo{align-items:center}.janela{max-width:560px;border-radius:20px}}
@keyframes sobe{from{transform:translateY(30px)}to{transform:none}}
.janela-topo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.janela-topo h3{margin:0;font-size:17px;flex:1}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.campo label{font-size:12.5px;font-weight:600;color:var(--texto-2)}
.campo input,.campo textarea,.campo select{background:var(--campo);border:1px solid var(--borda);border-radius:var(--raio-p);padding:10px 12px;outline:none;width:100%}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--caramelo)}
.campo textarea{resize:vertical;min-height:80px}
.campo small{font-size:12px;color:var(--texto-2)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{border-radius:12px;overflow:hidden;background:var(--latte);margin-bottom:12px}
.preview img{width:100%;display:block;max-height:60vh;object-fit:contain;background:var(--img-fundo)}
.galeria{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 10px;padding:2px;scrollbar-width:thin}
.g-it{position:relative;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--latte)}
.g-it.on{border-color:var(--caramelo)}
.g-it img{width:100%;height:100%;object-fit:cover;display:block}
.g-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(59,36,22,.72);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.g-x svg.i{width:12px;height:12px}
.g-it:hover .g-x,.g-it.on .g-x{opacity:1}
@media(pointer:coarse){.g-x{opacity:1}}
.g-add{flex:none;width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--caramelo);display:grid;place-items:center;color:var(--mocha)}
.g-add:hover{background:var(--creme)}
.caixa-arq{display:flex;align-items:center;gap:10px;background:var(--creme);border-radius:12px;padding:10px;margin-bottom:12px}
.caixa-arq .meio{flex:1;min-width:0}
.caixa-arq .meio div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caixa-arq .meio small{color:var(--texto-2)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.acoes .esp{flex:1}
.troca{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-weight:500}
.troca input{width:18px;height:18px;accent-color:var(--espresso)}

/* Listas de página (arquivados, colunas) */
.lista-p{display:flex;flex-direction:column;gap:8px}
.linha-p{display:flex;align-items:center;gap:10px;background:var(--espuma);border-radius:12px;padding:10px 12px;box-shadow:var(--sombra)}
.linha-p .meio{flex:1;min-width:0}
.linha-p .meio .tit{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-p .meio small{color:var(--texto-2)}
.cartao-cfg{background:var(--espuma);border-radius:var(--raio);padding:14px;box-shadow:var(--sombra);margin-bottom:12px}
.cartao-cfg h4{margin:0 0 6px;font-size:15px}
.cartao-cfg p{margin:0 0 10px;color:var(--texto-2);font-size:14px}
.grade-ico{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grade-ico button{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:var(--creme)}
.grade-ico button.on{background:var(--espresso);color:var(--espuma)}
.grade-cor{display:flex;gap:8px;flex-wrap:wrap}
.grade-cor button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.grade-cor button.on{border-color:var(--espresso)}

/* Avisos */
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--espresso);color:var(--espuma);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast button{color:var(--caramelo);font-weight:700}
.carregando{display:grid;place-items:center;min-height:60vh;color:var(--texto-2);text-align:center;gap:10px}
.login{max-width:360px;margin:12vh auto;background:var(--espuma);border-radius:20px;padding:22px;box-shadow:var(--sombra)}
.login h2{margin:0 0 4px}
.erro{color:var(--terracota);font-size:13px;min-height:18px}
.menu .marca .col-ico{color:var(--espuma)}
.menu a .cont{margin-left:auto;font-size:12px;font-weight:700;background:var(--terracota);color:#fff;border-radius:9px;padding:1px 7px}
.coluna.piscar{animation:piscar 1s ease}
@keyframes piscar{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--caramelo)}}

/* Seleção múltipla */
.cartao .marca-sel{display:none;position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;border:2px solid var(--caramelo);background:var(--espuma);z-index:2;place-items:center;color:var(--espuma)}
.selecionando .cartao .marca-sel{display:grid}
.selecionando .cartao{padding-left:38px}
.selecionando .cartao .thumb{margin-left:-38px}
.cartao.sel{border-color:var(--caramelo);box-shadow:0 0 0 2px var(--caramelo)}
.cartao.sel .marca-sel{background:var(--caramelo)}
.barra-sel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:45;background:var(--espresso);color:var(--espuma);border-radius:16px;padding:8px;display:flex;align-items:center;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:96vw;overflow-x:auto}
.barra-sel .n{font-weight:700;padding:0 8px 0 6px;white-space:nowrap}
.barra-sel button{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--espuma)}
.barra-sel button:hover{background:rgba(255,255,255,.12)}
html[data-tema="escuro"] .barra-sel button:hover{background:rgba(0,0,0,.12)}
body.com-sel .toasts{bottom:84px}

/* A fazer, checklist, sensível, agenda */
.ck-feito{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--caramelo);display:grid;place-items:center;color:transparent;margin-top:1px}
.ck-feito:hover{background:var(--latte)}

<script>
/* =====================================================================
   3. CONFIGURAÇÃO
   Preencha só quando for publicar no GitHub Pages com Supabase.
   Dentro do Claude o app usa o armazenamento da sua conta do Claude;
   aberto como arquivo solto, sem Supabase, guarda só neste navegador.
   ===================================================================== */
const CONFIG = {
  supabaseUrl: "https://vqpckzkikjndimrmpxkn.supabase.co",        // ex.: https://xxxx.supabase.co
  supabaseKey: "sb_publishable_Ed7fWDC_pQlim05wbkalOg_KN_8R-Et",        // publishable (anon) key — nunca a secret key
  bucket: "caixa",        // bucket do Supabase Storage para arquivos e prints

  // Avisos de ideias paradas (push). Gere em Configurações → Avisos e cole a chave pública aqui.
  vapidPublica: "",

  // Integração com a Agenda e Controle de Estudos (outro projeto do Supabase).
  // Só URL e publishable key, as mesmas que estão em agenda-estudos/js/config.js.
  agendaUrl: "https://auvwotlbrxogplltzckt.supabase.co",
  agendaKey: "sb_publishable_cO4olqyl26KuOFcEb6-Tsw_OsV77BCc",
  agendaApp: "https://matheusbellei.github.io/agenda-estudos/"
};
const LIBS = {
  supabase: "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js",
  tesseract: "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js",
  tesseractLang: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/por/4.0.0_best_int",
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"
};

/* =====================================================================
   4. ARMAZENAMENTO — a única parte que conversa com onde os dados ficam.
   Todos os adaptadores têm a mesma interface:
     init() → bool · carregar() → [docs] · gravar(doc) · apagar(id)
     enviar(file) → ref · url(ref) → Promise<url> · apagarArq(ref)
   Um "doc" é {id, tipo:'coluna'|'item', ...campos}.
   ===================================================================== */
const Adaptadores = {};

/* 4.1 Conta do Claude (db + assets) */
Adaptadores.claude = {
  nome: "Salvo na sua conta do Claude",
  fila: {},
  async init(){
    if(!(window.claude && window.claude.use)) return false;
    const db = await window.claude.use("db");
    if(!db) return false;
    const user = await window.claude.use("user");
    const uid = user ? await user.id() : null;
    if(!uid) return false;
    this.col = db.collection("data/users/" + uid);
    try{ this.assets = await window.claude.use("assets"); }catch(e){ this.assets = null; }
    try{ this.downloads = await window.claude.use("downloads"); }catch(e){ this.downloads = null; }
    return true;
  },
  async carregar(){
    const snap = await this.col.get();
    return snap.docs.map(d => ({...d.data(), id: d.id}));
  },
  _enfileirar(id, fn){
    const ant = this.fila[id] || Promise.resolve();
    const prox = ant.catch(()=>{}).then(fn);
    this.fila[id] = prox;
    return prox;
  },
  gravar(doc){ const c = JSON.parse(JSON.stringify(doc)); return this._enfileirar(doc.id, () => this.col.doc(doc.id).set(c)); },
  apagar(id){ return this._enfileirar(id, () => this.col.doc(id).delete()); },
  async enviar(file){
    if(!this.assets) throw new Error("Envio de arquivos indisponível nesta visualização.");
    const r = await this.assets.upload(file);
    return r.id;
  },
  async url(ref){ return "/_blob/" + ref; },
  async apagarArq(ref){ try{ if(this.assets) await this.assets.delete(ref); }catch(e){} },
  metaId(){ return "c_meta"; }
};

/* 4.2 Supabase (para o GitHub Pages) */
Adaptadores.supabase = {
  nome: "Salvo no Supabase",
  urls: {},
  async init(){
    if(!CONFIG.supabaseUrl || !CONFIG.supabaseKey) return false;
    await carregarScript(LIBS.supabase);
    const base = CONFIG.supabaseUrl.trim().replace(/\/(rest|auth|storage)\/v1\/?.*$/, "").replace(/\/+$/, "");
    this.sb = window.supabase.createClient(base, CONFIG.supabaseKey.trim());
    const { data } = await this.sb.auth.getSession();
    if(!data.session){ await telaLogin(this.sb); }
    const s = await this.sb.auth.getSession();
    this.uid = s.data.session.user.id;
    this.email = s.data.session.user.email || "";
    return true;
  },
  async carregar(){
    const out = [];
    for(const t of ["caixa_colunas","caixa_itens"]){
      // O Supabase devolve no máximo 1000 linhas por vez: busca em páginas
      for(let de = 0; ; de += 1000){
        const { data, error } = await this.sb.from(t).select("id,dados").order("id").range(de, de + 999);
        if(error) throw error;
        data.forEach(r => out.push({...r.dados, id: r.id}));
        if(data.length < 1000) break;
      }
    }
    return out;
  },
  // Colunas e o documento de ajustes (tipo "meta") ficam em caixa_colunas; itens em caixa_itens
  tabela(doc){ return doc.tipo === "item" ? "caixa_itens" : "caixa_colunas"; },
  metaId(){ return "c_meta_" + this.uid; },
  async salvarInscricao(sub){
    const j = sub.toJSON();
    const { error } = await this.sb.from("caixa_push").upsert({ endpoint: j.endpoint, inscricao: j, aparelho: navigator.userAgent.slice(0, 120) });
    if(error) throw error;
  },
  async removerInscricao(endpoint){ await this.sb.from("caixa_push").delete().eq("endpoint", endpoint); },
  async testarAviso(){
    const { data, error } = await this.sb.functions.invoke("avisar-ideias-paradas", { body: { teste: true } });
    if(error) throw error;
    return data;
  },
  async gravar(doc){
    const { error } = await this.sb.from(this.tabela(doc)).upsert({ id: doc.id, dados: doc });
    if(error) throw error;
  },
  async apagar(id){
    const t = id.startsWith("c_") ? "caixa_colunas" : "caixa_itens";
    const { error } = await this.sb.from(t).delete().eq("id", id);
    if(error) throw error;
  },
  async enviar(file){
    const caminho = this.uid + "/" + novoId("f") + "-" + file.name.replace(/[^\w.\-]+/g, "_");
    const { error } = await this.sb.storage.from(CONFIG.bucket).upload(caminho, file, { contentType: file.type });
    if(error) throw error;
    return caminho;
  },
  async url(ref){
    const c = this.urls[ref];
    if(c && c.ate > Date.now()) return c.url;
    const { data } = await this.sb.storage.from(CONFIG.bucket).createSignedUrl(ref, 3600);
    this.urls[ref] = { url: data.signedUrl, ate: Date.now() + 3300e3 };
    return data.signedUrl;
  },
  async apagarArq(ref){ await this.sb.storage.from(CONFIG.bucket).remove([ref]); }
};

/* 4.3 Só neste navegador (IndexedDB) */
Adaptadores.local = {
  nome: "Salvo só neste navegador",
  urls: {},
  async init(){
    if(!window.indexedDB) return false;
    this.db = await new Promise((ok, ruim) => {
      const r = indexedDB.open("caixa-pessoal", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("docs", { keyPath: "id" }); r.result.createObjectStore("arquivos", { keyPath: "id" }); };
      r.onsuccess = () => ok(r.result); r.onerror = () => ruim(r.error);
    });
    return true;
  },
  _tx(loja, modo, fn){
    return new Promise((ok, ruim) => {
      const tx = this.db.transaction(loja, modo); const st = tx.objectStore(loja);
      const r = fn(st); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => ruim(tx.error);
    });
  },
  carregar(){ return this._tx("docs", "readonly", st => st.getAll()); },
  gravar(doc){ const c = JSON.parse(JSON.stringify(doc)); return this._tx("docs", "readwrite", st => st.put(c)); },
  apagar(id){ return this._tx("docs", "readwrite", st => st.delete(id)); },
  async enviar(file){ const id = novoId("f"); await this._tx("arquivos", "readwrite", st => st.put({ id, blob: file })); return id; },
  async url(ref){
    if(this.urls[ref]) return this.urls[ref];
    const r = await this._tx("arquivos", "readonly", st => st.get(ref));
    if(!r) return "";
    return (this.urls[ref] = URL.createObjectURL(r.blob));
  },
  apagarArq(ref){ return this._tx("arquivos", "readwrite", st => st.delete(ref)); },
  metaId(){ return "c_meta"; }
};

/* Memória pura, caso nada mais funcione (nada fica salvo) */
Adaptadores.memoria = {
  nome: "Sem armazenamento: nada fica salvo", docs: {}, arqs: {},
  async init(){ return true; }, async carregar(){ return Object.values(this.docs); },
  async gravar(d){ this.docs[d.id] = JSON.parse(JSON.stringify(d)); }, async apagar(id){ delete this.docs[id]; },
  async enviar(f){ const id = novoId("f"); this.arqs[id] = URL.createObjectURL(f); return id; },
  async url(ref){ return this.arqs[ref] || ""; }, async apagarArq(ref){ delete this.arqs[ref]; },
  metaId(){ return "c_meta"; }
};

let Store = null;
async function iniciarArmazenamento(){
  const ordem = (CONFIG.supabaseUrl && !(window.claude && window.claude.use)) ? ["supabase","local","memoria"] : ["claude","supabase","local","memoria"];
  for(const nome of ordem){
    try{ if(await Adaptadores[nome].init()){ Store = Adaptadores[nome]; Store.id = nome; return; } }
    catch(e){ console.warn("Armazenamento", nome, "falhou:", e); }
  }
}

function carregarScript(src){
  return new Promise((ok, ruim) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ruim; document.head.appendChild(s); });
}

function explicarErro(e){
  const m = String(e && (e.message || e.code || e) || "");
  if(/could not find the table|does not exist|PGRST205|42P01/i.test(m + (e && e.code))) return "As tabelas não existem neste projeto: rode o supabase-caixa.sql no SQL Editor do Supabase.";
  if(/permission denied|42501/i.test(m + (e && e.code))) return "Sem permissão nas tabelas: rode de novo o supabase-caixa.sql (ele inclui as permissões).";
  return "Detalhe: " + m;
}
function erroLogin(e){
  const m = String(e && (e.message || e) || "");
  if(/invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if(/email not confirmed/i.test(m)) return "Usuário ainda não confirmado no Supabase (Authentication → Users).";
  if(/email logins are disabled|provider is not enabled/i.test(m)) return "O login por e-mail está desligado no Supabase (Authentication → Sign In / Providers → Email).";
  if(/invalid api key|no api key|secret api key|apikey/i.test(m)) return "Chave do Supabase inválida. Use a publishable/anon key na seção 3.";
  if(/failed to fetch|network|load failed/i.test(m)) return "Não consegui falar com o Supabase. Confira a supabaseUrl (formato https://xxxx.supabase.co).";
  return "Erro do Supabase: " + m;
}
function telaLogin(sb){
  return new Promise(ok => {
    document.getElementById("topo").classList.add("hidden");
    main.innerHTML = `<form class="login" id="f-login"><h2>Caixa Pessoal</h2><p class="sub" style="color:var(--texto-2);margin:0 0 16px">Entre com sua conta</p>
      <div class="campo"><label>E-mail</label><input type="email" id="lg-email" required autocomplete="email"></div>
      <div class="campo"><label>Senha</label><input type="password" id="lg-senha" required autocomplete="current-password"></div>
      <div class="erro" id="lg-erro"></div><button class="bt pri" style="width:100%">Entrar</button></form>`;
    document.getElementById("f-login").onsubmit = async ev => {
      ev.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: $("#lg-email").value, password: $("#lg-senha").value });
      if(error){ console.error("Login Supabase:", error); $("#lg-erro").textContent = erroLogin(error); return; }
      document.getElementById("topo").classList.remove("hidden");
      ok();
    };
  });
}

/* =====================================================================
   5. MODELO E REGRAS
   Coluna: {id:'c_…', tipo:'coluna', nome, icone, cor, destino, ordem, oculta}
     destino = que conteúdo cai nela automaticamente: link | arquivo | imagem | texto | nenhum
   Item:   {id:'i_…', tipo:'item', colId, titulo, texto, url,
            arquivo:{ref,nome,mime,tamanho}|null, extras:[{ref,nome,mime,tamanho}],
            tags:[], fixado,
     "arquivo" é o primeiro anexo (capa); "extras" guarda as demais imagens/arquivos do mesmo card.
            arquivado, ordem, criadoEm, atualizadoEm}
   ===================================================================== */
const ICONES = {
  menu:"M4 6h16M4 12h16M4 18h16", search:"M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M21 21l-6-6",
  plus:"M12 5v14M5 12h14", x:"M18 6L6 18M6 6l12 12", check:"M5 12l5 5L20 7",
  link:"M9 15l6-6M11 6l.463-.536a5 5 0 0 1 7.071 7.072L18 13M13 18l-.397.534a5.068 5.068 0 0 1-7.127 0a4.972 4.972 0 0 1 0-7.071L6 11",

const colunasVisiveis = () => E.colunas.filter(c => !c.oculta).sort((a,b) => a.ordem - b.ordem);

function colunaDestino(tipo){
  const vis = colunasVisiveis();
  return vis.find(c => c.destino === tipo) || vis.find(c => c.destino === "texto") || vis[0];
}
function itensDa(colId){
  const c = colunaPor(colId);
  return ordenarItens(E.itens.filter(i => i.colId === colId && !i.arquivado && ativo(i) && passaFiltro(i)), c);
}
function ordenarItens(lista, c){
  const ord = (c && c.ordenacao) || "manual";
  const cmp = {
    manual: (a,b) => a.ordem - b.ordem,
    recentes: (a,b) => (b.criadoEm||"").localeCompare(a.criadoEm||""),
    antigos: (a,b) => (a.criadoEm||"").localeCompare(b.criadoEm||""),
    az: (a,b) => nomeItem(a).localeCompare(nomeItem(b), "pt-BR", { sensitivity: "base", numeric: true })
  }[ord] || ((a,b) => a.ordem - b.ordem);
  // Fixados em cima; numa coluna de tarefas, os feitos descem para o fim
  return lista.sort((a,b) => (b.fixado?1:0) - (a.fixado?1:0) || (c && c.tarefas ? (a.feito?1:0) - (b.feito?1:0) : 0) || cmp(a,b));
}
function textoBusca(i){
  return [i.titulo, i.texto, i.url, arquivosDe(i).map(a => a.nome).join(" "), (i.tags||[]).join(" "), (i.checklist||[]).map(x => x.t).join(" "), i.textoExtraido || ""].join(" ");
}
function passaFiltro(i){
  if(E.tag && !(i.tags||[]).includes(E.tag)) return false;
  if(!E.busca) return true;
  return normal(textoBusca(i)).includes(normal(E.busca));
}
function nomeItem(i){
  return i.titulo || (i.texto ? i.texto.trim().split("\n")[0] : "") || ((i.checklist||[])[0] || {}).t || (i.arquivo && i.arquivo.nome) || (i.url ? hostDe(i.url) : "") || "Sem título";
}
/* Ideias paradas: sem editar, mover ou abrir há mais de N dias */
function diasParada(){ return Math.max(1, +(E.meta && E.meta.diasParada) || 7); }
function ultimoToque(i){ return Math.max(...[i.atualizadoEm, i.vistoEm, i.criadoEm].map(x => x ? Date.parse(x) || 0 : 0)); }
function estaParada(i){
  const c = colunaPor(i.colId);
  return !!(c && c.avisarParada && !i.arquivado && ativo(i) && !i.feito && Date.now() - ultimoToque(i) > diasParada() * 864e5);
}
const itensParados = () => E.itens.filter(estaParada).sort((a,b) => ultimoToque(a) - ultimoToque(b));
function diasDesde(ms){ return Math.floor((Date.now() - ms) / 864e5); }
/* Links repetidos: compara sem www, barra final, #âncora e parâmetros de rastreio */
function chaveUrl(u){
  try{
    const x = new URL(normalizarUrl(String(u).trim())); x.hash = "";
    [...x.searchParams.keys()].forEach(k => { if(/^(utm_|fbclid$|gclid$|igsh|igshid$|si$|mc_|ref_src$|_ga$)/i.test(k)) x.searchParams.delete(k); });
    const q = x.searchParams.toString();
    return (x.hostname.replace(/^www\./, "") + x.pathname.replace(/\/+$/, "") + (q ? "?" + q : "")).toLowerCase();
  }catch(e){ return String(u).trim().toLowerCase(); }
}
function linkExistente(u, ignorar){
  const k = chaveUrl(u);
  return E.itens.find(i => i !== ignorar && i.url && ativo(i) && chaveUrl(i.url) === k);
}
/* Checklist: linhas "[ ] texto", "- [ ] texto" ou "[x] texto" viram itens marcáveis */
const RX_CHK = /^\s*(?:[-*]\s*)?\[( |x|X)?\]\s*(.+)$/;
function separarChecklist(texto){
  const chk = [], resto = [];
  String(texto || "").split("\n").forEach(l => { const m = l.match(RX_CHK); if(m) chk.push({ id: novoId("k"), t: m[2].trim(), ok: !!(m[1] && m[1].trim()) }); else resto.push(l); });
  return { checklist: chk, resto: resto.join("\n").trim() };
}
function arquivosDe(i){ return [i.arquivo, ...(i.extras || [])].filter(Boolean); }
const ehImagem = a => /^image\//.test((a && a.mime) || "");
async function enviarArquivo(f){ const ref = await Store.enviar(f); Leitor.guardarBlob(ref, f); return { ref, nome: f.name || "imagem.png", mime: f.type, tamanho: f.size }; }
function nomearColado(f, k){
  return f.name && f.name !== "image.png" ? f : new File([f], `print-${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}${k ? "-" + k : ""}.${(f.type.split("/")[1] || "png").replace("jpeg","jpg")}`, { type: f.type });
}
function normal(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function tipoConteudo(i){
  if(i.arquivo && /^image\//.test(i.arquivo.mime||"")) return "imagem";
  if(i.arquivo) return "arquivo";
  if(i.url) return "link";
  return "texto";
}
function extrairUrl(t){ const m = String(t).match(/(https?:\/\/[^\s<>"]+|www\.[^\s<>"]+)/i); return m ? m[0].replace(/[).,;]+$/, "") : null; }
function normalizarUrl(u){ return /^https?:\/\//i.test(u) ? u : "https://" + u; }
function hostDe(u){ try{ return new URL(normalizarUrl(u)).hostname.replace(/^www\./, ""); }catch(e){ return u; } }
function tituloDeUrl(u){
  try{
    const x = new URL(normalizarUrl(u)); const h = x.hostname.replace(/^www\./, "");
    const seg = decodeURIComponent(x.pathname).split("/").filter(Boolean).pop();
    if(!seg) return h;
    const limpo = seg.replace(/\.[a-z0-9]{2,5}$/i, "").replace(/[-_+]+/g, " ").trim();
    return limpo.length > 2 && !/^[\w]{16,}$/.test(limpo) ? limpo.charAt(0).toUpperCase() + limpo.slice(1) : h;
  }catch(e){ return u; }
}
function extrairTags(t){
  const tags = []; const resto = String(t).replace(/(^|\s)#([\p{L}\p{N}_-]{2,30})/gu, (m, a, tg) => { tags.push(tg.toLowerCase()); return a; });
  return { tags: [...new Set(tags)], resto: resto.replace(/[ \t]+\n/g, "\n").trim() };
}
function corDe(s){ let h = 0; for(const c of String(s)) h = (h*31 + c.charCodeAt(0)) >>> 0; return CORES[h % CORES.length]; }
function tamanho(b){ if(!b) return ""; if(b < 1024) return b + " B"; if(b < 1048576) return (b/1024).toFixed(0) + " KB"; return (b/1048576).toFixed(1).replace(".", ",") + " MB"; }
function extDe(nome){ const m = String(nome).match(/\.([a-z0-9]{1,5})$/i); return m ? m[1] : "arq"; }
function dataBR(iso, comHora){
  if(!iso) return ""; const d = new Date(iso);
  const s = d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric" });
  return comHora ? s + " " + d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" }) : s;
}
function todasTags(){ const m = {}; E.itens.filter(i => !i.arquivado && ativo(i)).forEach(i => (i.tags||[]).forEach(t => m[t] = (m[t]||0) + 1)); return Object.entries(m).sort((a,b) => b[1]-a[1]).map(x => x[0]); }

/* Gravações: atualizam o estado na hora e salvam em segundo plano */
async function salvar(doc){
  try{ await Store.gravar(doc); }
  catch(e){ console.error(e); aviso("Não consegui salvar. Confira sua conexão."); }
}
function salvarItem(it){ it.atualizadoEm = agora(); if(!E.itens.includes(it)) E.itens.push(it); salvar(it); }
function salvarColuna(c){ if(!E.colunas.includes(c)) E.colunas.push(c); salvar(c); }
/* Excluir manda para a lixeira; some de vez depois de 30 dias ou pela Lixeira */
const DIAS_LIXEIRA = 30;
function paraLixeira(lista, comDesfazer){
  const its = [].concat(lista);
  its.forEach(it => { it.excluidoEm = agora(); salvarItem(it); });
  sairSelecao(true); desenhar();
  const msg = its.length > 1 ? `${its.length} itens foram para a lixeira` : "Foi para a lixeira";
  if(comDesfazer !== false) aviso(msg, { txt: "Desfazer", fn: () => { its.forEach(it => { it.excluidoEm = null; salvarItem(it); }); desenhar(); } });
}
function restaurar(it){
  it.excluidoEm = null;
  if(!colunaPor(it.colId)){ const c = colunasVisiveis()[0] || E.colunas[0]; if(c){ it.colId = c.id; it.ordem = proximaOrdem(c.id, true); } }
  salvarItem(it);
}
async function apagarDeVez(it){
  E.itens = E.itens.filter(x => x !== it);
  try{ await Store.apagar(it.id); for(const a of arquivosDe(it)) await Store.apagarArq(a.ref); }catch(e){ aviso("Não consegui excluir."); }
}
async function limparLixeiraVencida(){
  const limite = Date.now() - DIAS_LIXEIRA * 864e5;
  for(const it of E.itens.filter(i => i.excluidoEm && Date.parse(i.excluidoEm) < limite)) await apagarDeVez(it);
}
/* Ajustes que valem em todos os aparelhos (dias para "parada" etc.) */
function salvarMeta(mud){ Object.assign(E.meta, mud); salvar(E.meta); }
function proximaOrdem(colId, noTopo){
  const ords = E.itens.filter(i => i.colId === colId).map(i => i.ordem);
  if(!ords.length) return 1000;
  return noTopo ? Math.min(...ords) - 1000 : Math.max(...ords) + 1000;
}

const ROTAS = { caixa:"Caixa", paradas:"Paradas", arquivados:"Arquivados", lixeira:"Lixeira", colunas:"Colunas", ajustes:"Configurações" };
function irPara(){
  const r = location.hash.replace("#", "");
  E.rota = ROTAS[r] ? r : "caixa";
  document.querySelectorAll(".menu a").forEach(a => a.classList.toggle("on", a.dataset.rota === E.rota));
  $("#titulo").textContent = ROTAS[E.rota];
  $("#bt-busca").classList.toggle("hidden", E.rota !== "caixa");

  if(E.rota !== "caixa"){ fecharBusca(true); sairSelecao(true); }

function linksDaCaptura(){

  if(linhas.length < 2 || !linhas.every(l => extrairUrl(l))) return null;
  return linhas.map(l => { const u = extrairUrl(l); const tit = l.replace(u, "").replace(/^[\s\-–—:|•]+|[\s\-–—:|•]+$/g, ""); return { url: normalizarUrl(u), titulo: tit || tituloDeUrl(u) }; });
}
function tipoDaCaptura(){
  if(Cap.arquivos.length) return Cap.arquivos.every(p => /^image\//.test(p.file.type)) ? "imagem" : "arquivo";

  if(!t) return (Cap.titulo.trim() || Cap.desc.trim()) ? "texto" : null;

function limparCaptura(){
  Cap.arquivos.forEach(p => p.url && URL.revokeObjectURL(p.url));
  Object.assign(Cap, { texto: "", titulo: "", desc: "", arquivos: [], colId: null, manual: false, juntar: true });
  const ta = $("#cap-txt"); if(ta){ ta.value = ""; autoAltura(ta); }

async function guardarCaptura(){
  const tipo = tipoDaCaptura(); if(!tipo) return;
  const destino = colunaPor(Cap.colId) || colunaDestino(tipo);
  if(!destino){ aviso("Crie uma coluna primeiro."); return; }
  const principal = extrairTags(Cap.texto), descricao = extrairTags(Cap.desc);
  const tags = [...new Set([...principal.tags, ...descricao.tags])];
  const resto = principal.resto, titM = Cap.titulo.trim(), descM = descricao.resto;
  const comDesc = t => [String(t || "").trim(), descM].filter(Boolean).join("\n\n");
  const base = () => ({ id: novoId("i"), tipo: "item", colId: destino.id, titulo: "", texto: "", url: "", arquivo: null, extras: [], tags: [...tags], fixado: false, arquivado: false, criadoEm: agora() });
  const novos = [];
  const varios = linksDaCaptura();
  let pulados = 0;
  // Esvazia a captura na hora: dá para ir guardando a próxima coisa enquanto os arquivos sobem
  const arqsCap = [...Cap.arquivos], manualCap = Cap.manual, juntarCap = Cap.juntar;
  Cap.arquivos = []; limparCaptura();
  if(varios){
    for(const l of varios){
      if(linkExistente(l.url) || novos.some(n => chaveUrl(n.url) === chaveUrl(l.url))){ pulados++; continue; }
      const it = base(); it.url = l.url; it.titulo = l.titulo.slice(0, 140); it.texto = descM; novos.push(it);
    }
  } else if(arqsCap.length){
    const arqs = arqsCap;
    const juntar = juntarCap && arqs.length > 1;
    const msg = aviso(arqs.length > 1 ? `Enviando ${arqs.length} arquivos…` : "Enviando…", null, 0);
    const metas = [];
    for(const p of arqs){
      try{ metas.push(await enviarArquivo(p.file)); }
      catch(e){ console.error(e); aviso("Não consegui enviar " + (p.file.name || "a imagem") + "."); }
    }
    msg && msg.remove();
    // Juntos: um card só, com as imagens primeiro (a primeira vira a capa). Separados: um card por arquivo.
    const grupos = juntar ? [[...metas.filter(ehImagem), ...metas.filter(a => !ehImagem(a))]] : metas.map(m => [m]);
    const unico = grupos.length === 1;
    for(const g of grupos){
      if(!g.length) continue;
      const it = base();
      if(!manualCap && !unico){ const d = colunaDestino(ehImagem(g[0]) ? "imagem" : "arquivo"); if(d) it.colId = d.id; }
      it.arquivo = g[0]; it.extras = g.slice(1);
      if(unico){
        if(titM){ it.titulo = titM; it.texto = comDesc(resto); }
        else { it.titulo = resto.split("\n")[0].slice(0, 120); it.texto = comDesc(resto.split("\n").slice(1).join("\n")); }
        const u = extrairUrl(resto); if(u) it.url = normalizarUrl(u);
      } else { it.titulo = titM; it.texto = comDesc(resto); }
      if(!it.titulo && !ehImagem(g[0])) it.titulo = g[0].nome.replace(/\.[^.]+$/, "");
      novos.push(it);
    }
  } else {
    const it = base();
    const u = extrairUrl(resto);
    if(u){
      it.url = normalizarUrl(u);
      const linhas = resto.replace(u, "").trim().split("\n").map(s => s.trim()).filter(Boolean);
      if(titM){ it.titulo = titM; it.texto = comDesc(linhas.join("\n")); }
      else if(linhas.length){ it.titulo = linhas[0].slice(0, 140); it.texto = comDesc(linhas.slice(1).join("\n")); }
      else { it.titulo = tituloDeUrl(u); it.texto = descM; }
    } else {
      it.titulo = titM; it.texto = comDesc(resto);
    }
    novos.push(it);
  }
  for(const it of novos){
    // Linhas "[ ] ..." viram checklist
    const ch = separarChecklist(it.texto);
    if(ch.checklist.length){ it.checklist = ch.checklist; it.texto = ch.resto; }
    it.ordem = proximaOrdem(it.colId, true); salvarItem(it);
    Leitor.agendar(it);
  }
  arqsCap.forEach(p => p.url && URL.revokeObjectURL(p.url));
  desenharQuadro();
  if(novos.length){
    const c = colunaPor(novos[0].colId);
    const txt = novos.length > 1 ? `${novos.length} itens guardados em ${c ? c.nome : "sua caixa"}` : `Guardado em ${c ? c.nome : "sua caixa"}`;
    aviso(txt + (pulados ? ` · ${pulados} ${pulados === 1 ? "repetido pulado" : "repetidos pulados"}` : ""), novos.length === 1 ? { txt: "Abrir", fn: () => abrirItem(novos[0]) } : null);
    destacarColuna(novos[0].colId);
  } else if(pulados){ aviso(pulados === 1 ? "Esse link já estava na caixa" : "Todos esses links já estavam na caixa"); }
}

function ligarCartao(el, it){
  let segurou = false, timer = null, x0 = 0, y0 = 0;
  // Segurar o card (celular) entra na seleção
  el.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse") return;
    segurou = false; x0 = e.clientX; y0 = e.clientY;
    timer = setTimeout(() => { segurou = true; if(navigator.vibrate) navigator.vibrate(15); if(!E.sel) entrarSelecao(); alternarSel(it); }, 480);
  });
  const cancelar = () => clearTimeout(timer);
  el.addEventListener("pointerup", cancelar); el.addEventListener("pointercancel", cancelar);
  el.addEventListener("pointermove", e => { if(Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) > 12) cancelar(); });
  el.addEventListener("contextmenu", e => { if(segurou || E.sel) e.preventDefault(); });
  el.onclick = e => {
    if(segurou){ segurou = false; return; }
    if(E.sel || e.ctrlKey || e.metaKey){ e.preventDefault(); if(!E.sel) entrarSelecao(); alternarSel(it); return; }
    const ck = e.target.closest("[data-ck]");
    if(ck){ e.stopPropagation(); const k = (it.checklist || []).find(x => x.id === ck.dataset.ck); if(k){ k.ok = !k.ok; salvarItem(it); desenharQuadro(); } return; }
    if(e.target.closest(".ck-feito")){ e.stopPropagation(); alternarFeito(it); return; }
    if(e.target.closest("a")) return;
    if(it.sensivel && !E.revelados.has(it.id)){ E.revelados.add(it.id); desenharQuadro(); return; }
    abrirItem(it);
  };
  el.onkeydown = e => { if(e.key === "Enter") abrirItem(it); };
}
function alternarFeito(it){
  it.feito = !it.feito; it.feitoEm = it.feito ? agora() : null; salvarItem(it); desenhar();
  if(it.feito) aviso("Feito", { txt: "Desfazer", fn: () => { it.feito = false; it.feitoEm = null; salvarItem(it); desenhar(); } });
}
function textoVazio(c){
  return { link: "Cole um link na caixa acima", arquivo: "Solte PDFs e documentos aqui em cima", imagem: "Cole um print (Ctrl+V) ou anexe uma foto", texto: "Escreva uma ideia lá em cima", nenhum: "Use o + para guardar algo aqui" }[c.destino] || "Vazio";
}
function icoTipo(i){ return ({ imagem:"photo", arquivo:"file", link:"link", texto:"bulb" })[tipoConteudo(i)]; }
function trechoBusca(i){
  if(!E.busca || !i.textoExtraido) return "";
  const q = normal(E.busca), base = normal([i.titulo, i.texto, i.url].join(" "));
  if(base.includes(q)) return "";
  const t = i.textoExtraido, k = normal(t).indexOf(q);
  if(k < 0) return "";
  const ini = Math.max(0, k - 40), fim = Math.min(t.length, k + q.length + 60);

}
function checklistCartao(i, max){

function chipAgenda(i){

function cartao(i, c){
  const visual = (c && c.visual) || "cartoes";
  const oculto = i.sensivel && !E.revelados.has(i.id);
  const sel = E.sel && E.sel.has(i.id);

  if(visual === "lista"){
    const im = arquivosDe(i).find(ehImagem);

    const meta = l.length ? `${l.filter(x => x.ok).length}/${l.length}` : i.url ? hostDe(i.url) : "";
    return `<article class="${classes.join(" ")} compacto" data-id="${i.id}" draggable="true" tabindex="0">${marcaSel}${c && c.tarefas ? `<button class="ck-feito${i.feito ? " ok" : ""}" aria-label="Marcar como feito">${ico("check", 1)}</button>` : ""}

      <span class="tit${oculto ? " corpo-sens" : ""}">${esc(nomeItem(i))}</span>${meta ? `<span class="meta-c">${esc(meta)}</span>` : ""}${i.fixado ? `<span style="color:var(--caramelo)">${ico("pin", 1)}</span>` : ""}${veuSens}</article>`;
  }
  if(visual === "grade"){
    const im = arquivosDe(i).find(ehImagem);
    return `<article class="${classes.join(" ")} tile" data-id="${i.id}" draggable="true" tabindex="0">${marcaSel}
      ${im ? `<div class="tile-img${oculto ? " corpo-sens" : ""}"><img data-ref="${esc(im.ref)}" alt="" loading="lazy"></div>` : `<div class="tile-ico${oculto ? " corpo-sens" : ""}">${ico(icoTipo(i))}</div>`}
      <div class="tile-nome${oculto ? " corpo-sens" : ""}">${esc(nomeItem(i))}</div>${veuSens}</article>`;
  }
  const t = tipoConteudo(i);
  let corpo = "";
  const arqs = arquivosDe(i), ims = arqs.filter(ehImagem), docs = arqs.filter(a => !ehImagem(a));
  const nota = i.texto ? `<div class="nota">${esc(i.texto)}</div>` : "";
  const miniDocs = l => l.map(a => `<div class="mini-arq">${ico("file", 1)}<span>${esc(a.nome)}</span></div>`).join("");
  if(t === "imagem" || (t === "arquivo" && ims.length && !docs.length)){
    corpo = galeriaCartao(ims, i.titulo || i.arquivo.nome) + (i.titulo ? `<div class="tit">${esc(i.titulo)}</div>` : "") + miniDocs(docs) + nota;
  } else if(t === "arquivo"){
    const d = docs[0];
    corpo = (ims.length ? galeriaCartao(ims, i.titulo || d.nome) : "") +
      `<div class="linha-link"><div class="arquivo-ext">${esc(extDe(d.nome))}</div><div class="meio"><div class="tit">${esc(i.titulo || d.nome)}</div><div class="host">${esc(d.nome)} · ${tamanho(d.tamanho)}${docs.length > 1 ? ` · +${docs.length - 1}` : ""}</div></div></div>` + miniDocs(docs.slice(1)) + nota;
  } else if(t === "link"){
    const h = hostDe(i.url);
    corpo = `<div class="linha-link"><div class="avatar" style="background:${corDe(h)}">${esc(h.charAt(0))}</div><div class="meio"><div class="tit">${esc(i.titulo || h)}</div><div class="host">${esc(h)}</div></div><a class="abrir" href="${esc(i.url)}" target="_blank" rel="noopener" aria-label="Abrir link" title="Abrir link">${ico("external", 1)}</a></div>` + (i.texto ? `<div class="nota">${esc(i.texto)}</div>` : "");
  } else {
    corpo = (i.titulo ? `<div class="tit">${esc(i.titulo)}</div>` : "") + (i.texto ? `<div class="${i.titulo ? "nota" : "txt"}">${esc(i.texto)}</div>` : "");
  }
  corpo += checklistCartao(i, 5) + trechoBusca(i);
  const rod = chipAgenda(i) + (i.tags||[]).map(tg => `<span class="tag">#${esc(tg)}</span>`).join("") + (i.sensivel && !oculto ? `<span class="tag">${ico("lock", 1)}</span>` : "");
  if(c && c.tarefas) corpo = `<div class="linha-tarefa"><button class="ck-feito${i.feito ? " ok" : ""}" aria-label="${i.feito ? "Desmarcar" : "Marcar como feito"}">${ico("check", 1)}</button><div class="corpo">${corpo}</div></div>`;
  if(oculto) corpo = `<div class="corpo-sens">${corpo}</div>`;
  return `<article class="${classes.join(" ")}" data-id="${i.id}" draggable="true" tabindex="0">${marcaSel}${veuSens}${i.fixado ? `<span class="fixo" title="Fixado">${ico("pin", 1)}</span>` : ""}${corpo}<div class="rodape-c">${rod}</div></article>`;
}
/* Capa do card: 1 imagem inteira; 2, 3 ou 4+ em mosaico (com "+N" quando passa de 4) */
function galeriaCartao(ims, alt){
  const n = ims.length;
  if(n === 1) return `<div class="thumb"><img data-ref="${esc(ims[0].ref)}" alt="${esc(alt)}" loading="lazy"></div>`;
  return `<div class="thumb g${Math.min(n, 4)}" title="${n} imagens">${ims.slice(0, 4).map((a, k) => `<div><img data-ref="${esc(a.ref)}" alt="" loading="lazy">${k === 3 && n > 4 ? `<span class="mais">+${n - 4}</span>` : ""}</div>`).join("")}</div>`;
}
async function carregarImagens(raiz){
  for(const img of raiz.querySelectorAll("img[data-ref]")){
    try{ const u = await Store.url(img.dataset.ref); if(u) img.src = u; }catch(e){}
  }
}

/* Arrastar cartões entre colunas (computador). No celular, use "Coluna" dentro do item. */
let arrastando = null;
function ligarArrastar(q){
  q.querySelectorAll(".cartao").forEach(el => {
    el.addEventListener("dragstart", e => { if(E.sel){ e.preventDefault(); return; } arrastando = el.dataset.id; el.classList.add("arrastado"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "caixa:" + arrastando); });
    el.addEventListener("dragend", () => { arrastando = null; el.classList.remove("arrastado"); q.querySelectorAll(".marcador").forEach(m => m.remove()); q.querySelectorAll(".alvo").forEach(m => m.classList.remove("alvo")); });
  });
  q.querySelectorAll(".col-lista").forEach(lista => {
    lista.addEventListener("dragover", e => {
      if(!arrastando) return; e.preventDefault();
      lista.classList.add("alvo");
      q.querySelectorAll(".marcador").forEach(m => m.remove());
      const depois = cartaoDepois(lista, e.clientY);
      const m = document.createElement("div"); m.className = "marcador";
      depois ? lista.insertBefore(m, depois) : lista.appendChild(m);
    });
    lista.addEventListener("dragleave", e => { if(!lista.contains(e.relatedTarget)) lista.classList.remove("alvo"); });
    lista.addEventListener("drop", e => {
      if(!arrastando) return; e.preventDefault(); e.stopPropagation();
      const it = itemPor(arrastando); const depois = cartaoDepois(lista, e.clientY);
      moverItem(it, lista.dataset.col, depois ? depois.dataset.id : null);
    });
  });
}
function cartaoDepois(lista, y){
  const cs = [...lista.querySelectorAll(".cartao:not(.arrastado)")];
  return cs.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
}
function moverItem(it, colId, antesDeId){
  const lista = E.itens.filter(i => i.colId === colId && !i.arquivado && i !== it).sort((a,b) => a.ordem - b.ordem);
  const k = antesDeId ? lista.findIndex(i => i.id === antesDeId) : -1;
  let ordem;
  if(k === -1) ordem = lista.length ? lista[lista.length-1].ordem + 1000 : 1000;
  else if(k === 0) ordem = lista[0].ordem - 1000;
  else ordem = (lista[k-1].ordem + lista[k].ordem) / 2;
  const mudouCol = it.colId !== colId;
  const c = colunaPor(colId);
  if(c && c.ordenacao && c.ordenacao !== "manual" && !mudouCol) return;
  it.colId = colId; it.ordem = ordem; salvarItem(it); desenharQuadro();
  if(mudouCol) aviso("Movido para " + colunaPor(colId).nome);
}

/* 6.3 Janela do item: ver, editar, mover, arquivar, excluir */
function janela(html, aoFechar){
  const f = document.createElement("div"); f.className = "janela-fundo";
  f.innerHTML = `<div class="janela" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(f);
  const fechar = () => { f.remove(); document.removeEventListener("keydown", esc_); aoFechar && aoFechar(); };
  const esc_ = e => { if(e.key === "Escape") fechar(); };
  f.addEventListener("mousedown", e => { if(e.target === f) fechar(); });
  document.addEventListener("keydown", esc_);
  preencherIcones(f);
  return { el: f.querySelector(".janela"), fechar };
}

    <div class="acoes">
      ${it.excluidoEm ? `<button class="bt sec pq" id="j-rest">${ico("restaurar",1)}Restaurar</button>` : `<button class="bt perigo pq" id="j-del">${ico("trash",1)}Excluir</button>`}

    Object.assign(it, {
      titulo: el.querySelector("#j-tit").value.trim(), texto: ch.checklist.length ? ch.resto : novoTxt,
      checklist: [...checklist.filter(x => x.t.trim()), ...ch.checklist],
      sensivel: el.querySelector("#j-sens").checked,
      url: u ? normalizarUrl(u) : "", fixado,
      tags: [...new Set(el.querySelector("#j-tags").value.split(/[,\s]+/).map(s => s.replace(/^#/, "").trim().toLowerCase()).filter(Boolean))],
      arquivo: arqs[0] || null, extras: arqs.slice(1)
    });
    salvo = true;
    removidos.forEach(r => Promise.resolve(Store.apagarArq(r)).catch(() => {}));
    if(it.sensivel) E.revelados.delete(it.id);
    salvarItem(it); Leitor.agendar(it); j.fechar(); desenhar();
  };
  el.querySelector("#j-arc").onclick = () => {
    it.arquivado = !it.arquivado; salvarItem(it); j.fechar(); desenhar();
    aviso(it.arquivado ? "Arquivado" : "De volta à caixa", { txt: "Desfazer", fn: () => { it.arquivado = !it.arquivado; salvarItem(it); desenhar(); } });
  };
  const del = el.querySelector("#j-del"); if(del) del.onclick = () => { j.fechar(); paraLixeira(it); };
  const rest = el.querySelector("#j-rest"); if(rest) rest.onclick = () => { restaurar(it); j.fechar(); desenhar(); aviso("Restaurado"); };
}
function confirmar(titulo, texto, botao){
  return new Promise(ok => {
    const j = janela(`<div class="janela-topo"><h3>${esc(titulo)}</h3></div><p style="margin:0 0 16px;color:var(--texto-2)">${esc(texto)}</p>
      <div class="acoes"><span class="esp"></span><button class="bt leve" id="cf-n">Cancelar</button><button class="bt pri" id="cf-s" style="background:var(--terracota)">${esc(botao)}</button></div>`, () => ok(false));
    j.el.querySelector("#cf-n").onclick = () => j.fechar();
    j.el.querySelector("#cf-s").onclick = () => { ok(true); j.fechar(); };
  });
}
async function copiar(txt, msg){
  try{ await navigator.clipboard.writeText(txt); aviso(msg || "Copiado"); }
  catch(e){ aviso("Não consegui copiar automaticamente."); }
}

/* 6.4 Editar coluna */

    <div class="campo"><label for="k-dest">Recebe automaticamente</label><select id="k-dest">${Object.entries(DESTINOS).map(([k, v]) => `<option value="${k}"${k === c.destino ? " selected" : ""}>${v}</option>`).join("")}</select>
      <small>Quando você cola algo desse tipo na caixa, ele já vem marcado para esta coluna. Se duas colunas recebem o mesmo tipo, vale a primeira.</small></div>
    <div class="duas">
      <div class="campo"><label for="k-ord">Ordenar por</label><select id="k-ord">${Object.entries(ORDENACOES).map(([k, v]) => `<option value="${k}"${k === (c.ordenacao || "manual") ? " selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="campo"><label for="k-vis">Visualização</label><select id="k-vis">${Object.entries(VISUAIS).map(([k, v]) => `<option value="${k}"${k === (c.visual || "cartoes") ? " selected" : ""}>${v}</option>`).join("")}</select></div>

    ${nova ? "" : `<label class="troca"><input type="checkbox" id="k-oc"${c.oculta ? " checked" : ""}>Ocultar da página inicial</label>`}
    ${!nova && c.tarefas && E.itens.some(i => i.colId === c.id && i.feito && !i.arquivado && ativo(i)) ? `<button class="bt sec pq" id="k-arq-feitos" style="margin:4px 0 8px">${ico("archive", 1)}Arquivar os itens feitos</button>` : ""}
    <div class="acoes">
      ${nova ? "" : `<button class="bt perigo pq" id="k-del">${ico("trash",1)}Excluir</button>`}
      ${nova ? "" : `<button class="bt leve pq" id="k-esq" title="Mover para a esquerda">${ico("left",1)}</button><button class="bt leve pq" id="k-dir" title="Mover para a direita">${ico("right",1)}</button>`}
      <span class="esp"></span><button class="bt pri" id="k-ok">${nova ? "Criar" : "Salvar"}</button>
    </div>`);
  const el = j.el;
  el.querySelector("#k-x").onclick = j.fechar;
  el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { icone = b.dataset.i; el.querySelectorAll("[data-i]").forEach(x => x.classList.toggle("on", x === b)); });
  el.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { cor = b.dataset.c; el.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b)); });
  if(nova) setTimeout(() => el.querySelector("#k-nome").focus(), 50);
  el.querySelector("#k-ok").onclick = () => {
    const nome = el.querySelector("#k-nome").value.trim();
    if(!nome){ el.querySelector("#k-nome").focus(); return; }
    Object.assign(c, { nome, icone, cor, destino: el.querySelector("#k-dest").value, oculta: nova ? false : el.querySelector("#k-oc").checked,
      ordenacao: el.querySelector("#k-ord").value, visual: el.querySelector("#k-vis").value,
      tarefas: el.querySelector("#k-tar").checked, avisarParada: el.querySelector("#k-par").checked });
    salvarColuna(c); j.fechar(); desenhar();
  };
  const af = el.querySelector("#k-arq-feitos");
  if(af) af.onclick = () => {
    const fs = E.itens.filter(i => i.colId === c.id && i.feito && !i.arquivado && ativo(i));
    fs.forEach(i => { i.arquivado = true; salvarItem(i); }); j.fechar(); desenhar();
    aviso(`${fs.length} ${fs.length === 1 ? "item arquivado" : "itens arquivados"}`, { txt: "Desfazer", fn: () => { fs.forEach(i => { i.arquivado = false; salvarItem(i); }); desenhar(); } });

  if(!nova){
    el.querySelector("#k-esq").onclick = () => { trocarOrdem(c, -1); desenhar(); };

    el.querySelector("#k-del").onclick = async () => {

function excluirColunaComItens(c, qtd){
  const outras = E.colunas.filter(x => x !== c).sort((a,b) => a.ordem - b.ordem);
  const j = janela(`<div class="janela-topo"><h3>Excluir "${esc(c.nome)}"</h3></div>
    <p style="margin:0 0 12px;color:var(--texto-2)">Ela tem ${qtd} ${qtd === 1 ? "item" : "itens"}. O que fazer com ${qtd === 1 ? "ele" : "eles"}?</p>
    ${outras.length ? `<div class="campo"><label for="d-para">Mover para</label><select id="d-para">${outras.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join("")}</select></div>` : ""}
    <div class="acoes"><button class="bt perigo pq" id="d-tudo">Excluir tudo</button><span class="esp"></span><button class="bt leve" id="d-n">Cancelar</button>${outras.length ? `<button class="bt pri" id="d-mov">Mover e excluir</button>` : ""}</div>`);
  j.el.querySelector("#d-n").onclick = j.fechar;
  const mv = j.el.querySelector("#d-mov"); if(mv) mv.onclick = () => { excluirColuna(c, j.el.querySelector("#d-para").value); j.fechar(); };
  j.el.querySelector("#d-tudo").onclick = async () => { j.fechar(); if(await confirmar("Excluir a coluna e mandar os itens para a lixeira?", `Os itens ficam ${DIAS_LIXEIRA} dias na lixeira e, se restaurados, voltam para a primeira coluna.`, "Excluir")) excluirColuna(c, null); };
}
async function excluirColuna(c, paraId){
  const its = E.itens.filter(i => i.colId === c.id);
  for(const it of its){
    if(paraId){ it.colId = paraId; it.ordem = proximaOrdem(paraId); salvarItem(it); }
    else if(!it.excluidoEm){ it.excluidoEm = agora(); salvarItem(it); }
  }
  E.colunas = E.colunas.filter(x => x !== c);
  try{ await Store.apagar(c.id); }catch(e){}
  desenhar(); aviso("Coluna excluída");
}
function trocarOrdem(c, dir){
  const ord = [...E.colunas].sort((a,b) => a.ordem - b.ordem);
  const k = ord.indexOf(c), o = ord[k + dir];
  if(!o) return;
  [c.ordem, o.ordem] = [o.ordem, c.ordem];
  salvarColuna(c); salvarColuna(o);
}

async function exportarBackup(){
  const comArq = $("#bk-arq").checked;
  const dados = { app: "caixa-pessoal", versao: 1, exportadoEm: agora(), colunas: E.colunas, itens: JSON.parse(JSON.stringify(E.itens)), arquivos: {} };
  if(comArq){
    const msg = aviso("Preparando arquivos…", null, 0);
    for(const a of dados.itens.flatMap(arquivosDe)){
      try{ const u = await Store.url(a.ref); const b = await (await fetch(u)).blob(); dados.arquivos[a.ref] = await paraDataUrl(b); }catch(e){ console.warn("sem arquivo", a.nome); }
    }
    msg && msg.remove();
  }
  const texto = JSON.stringify(dados, null, 1);
  const nome = `caixa-pessoal-${new Date().toISOString().slice(0,10)}.json`;
  if(Store.id === "claude"){
    if(Store.downloads){ try{ await Store.downloads.save({ filename: nome, data: texto }); return; }catch(e){ if(e && /declin|cancel|reject/i.test(e.code || e.message || "")) return; } }
    copiar(texto, "Backup copiado. Cole num arquivo .json para guardar.");
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], { type: "application/json" })); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function paraDataUrl(b){ return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); }); }
async function importarBackup(f){
  let d; try{ d = JSON.parse(await f.text()); }catch(e){ aviso("Esse arquivo não é um backup válido."); return; }
  if(d.app !== "caixa-pessoal"){ aviso("Esse arquivo não é um backup da Caixa Pessoal."); return; }
  if(!await confirmar("Importar backup?", `${d.colunas.length} colunas e ${d.itens.length} itens. Itens com o mesmo código serão substituídos; o resto da caixa fica como está.`, "Importar")) return;
  const msg = aviso("Importando…", null, 0);
  for(const c of d.colunas){ const ex = colunaPor(c.id); if(ex) Object.assign(ex, c); else E.colunas.push(c); await Store.gravar(c); }
  for(const it of d.itens){
    for(const a of arquivosDe(it)){
      if(!(d.arquivos && d.arquivos[a.ref])) continue;
      try{ const b = await (await fetch(d.arquivos[a.ref])).blob(); a.ref = await Store.enviar(new File([b], a.nome, { type: a.mime })); }catch(e){ console.warn(e); }
    }
    const ex = itemPor(it.id); if(ex) Object.assign(ex, it); else E.itens.push(it);
    await Store.gravar(it);
  }
  msg && msg.remove(); aviso("Backup importado"); desenhar();
}

/* Avisos rápidos */
function aviso(txt, acao, ms){
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<span>${esc(txt)}</span>` + (acao ? `<button>${esc(acao.txt)}</button>` : "");
  if(acao) t.querySelector("button").onclick = () => { t.remove(); acao.fn(); };
  const caixa = $("#toasts"); caixa.appendChild(t);
  [...caixa.children].slice(0, -2).forEach(x => x.remove());
  if(ms !== 0) setTimeout(() => t.remove(), ms || 4500);
  return t;
}

const Instalar = {

  ios(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); },
  disponivel(){ return "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !(window.claude && window.claude.use); },
  cartao(){
    if(!this.disponivel()) return "";
    if(this.instalado()) return `<div class="cartao-cfg"><h4>App instalado</h4><p>Você está usando a Caixa como app.</p></div>`;
    if(this.pedido) return `<div class="cartao-cfg"><h4>Instalar o app</h4><p>Coloque a Caixa na tela inicial ou na barra de tarefas, abrindo em janela própria.</p><button class="bt pri pq" id="bt-instalar">${ico("download", 1)}Instalar app</button></div>`;

    return `<div class="cartao-cfg"><h4>Instalar o app</h4><p>No Chrome ou no Edge, use o ícone de instalar na barra de endereço, ou o menu ⋮ → “Instalar app” / “Adicionar à tela inicial”.</p></div>`;
  },
  ligar(){

    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); this.pedido = e; if(E.rota === "ajustes") telaAjustes(); });
    window.addEventListener("appinstalled", () => { this.pedido = null; if(E.rota === "ajustes") telaAjustes(); });
