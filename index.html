/* =====================================================================
   9. LEITURA DE TEXTO (prints e PDFs)
   Roda no próprio aparelho: Tesseract.js para imagens, PDF.js para PDFs.
   O texto vai para "textoExtraido" e entra na busca.
   ===================================================================== */
function limparTexto(t){ return String(t || "").replace(/[ \t]+/g, " ").replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n").trim(); }
const Leitor = {
  fila: [], atual: null, rodando: false, blobs: new Map(), worker: null,
  // No Claude o navegador bloqueia os downloads do leitor; funciona no GitHub Pages
  disponivel(){ return !(window.claude && window.claude.use); },
  guardarBlob(ref, f){ this.blobs.set(ref, f); if(this.blobs.size > 40) this.blobs.delete(this.blobs.keys().next().value); },
  alvos(it){ return arquivosDe(it).filter(a => ehImagem(a) || /pdf/i.test(a.mime || "") || /\.pdf$/i.test(a.nome || "")).slice(0, 8); },
  pode(it){ return !!it && this.disponivel() && this.alvos(it).length > 0; },
  assinatura(it){ return this.alvos(it).map(a => a.ref).join("|"); },
  lido(it){ return !!it.lidoEm && it.lidoAssin === this.assinatura(it); },
  naFila(it){ return this.atual === it.id || this.fila.includes(it.id); },
  pendentes(){ return E.itens.filter(i => ativo(i) && this.pode(i) && !this.lido(i)); },
  agendar(it, forcar){
    if(!this.pode(it) || this.naFila(it) || (!forcar && this.lido(it))) return;
    this.fila.push(it.id); this.rodar();
  },
  pilula(){
    const p = $("#pilula"), n = this.fila.length + (this.atual ? 1 : 0);
    if(!n){ p.classList.add("hidden"); return; }
    p.classList.remove("hidden");
    p.innerHTML = `<span class="gira"></span>Lendo texto${n > 1 ? ` de ${n} itens` : ""}…`;
  },
  async rodar(){
    if(this.rodando) return; this.rodando = true;
    while(this.fila.length){
      const id = this.fila.shift(); this.atual = id; this.pilula();
      const it = itemPor(id); if(!it) continue;
      const partes = []; let erro = false;
      for(const a of this.alvos(it)){
        try{
          const blob = this.blobs.get(a.ref) || await (await fetch(await Store.url(a.ref))).blob();
          const t = ehImagem(a) ? await this.ocr(blob) : await this.pdf(blob);
          if(t.trim()) partes.push(t.trim());
        }catch(e){ console.warn("Leitura falhou:", a.nome, e); erro = true; }
      }
      const x = itemPor(id); if(!x) continue;
      x.textoExtraido = limparTexto(partes.join("\n\n")).slice(0, 20000);
      x.lidoEm = agora(); x.lidoAssin = this.assinatura(x); x.leituraErro = erro && !partes.length;
      salvar(x);   // ler não conta como "mexer": não muda atualizadoEm
      if(E.rota === "caixa" && E.busca) desenharQuadro();
    }
    this.atual = null; this.rodando = false; this.pilula();
    if(this.worker){ try{ await this.worker.terminate(); }catch(e){} this.worker = null; }
  },
  async reduzir(blob){
    try{
      const bmp = await createImageBitmap(blob), max = 2400;
      const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      if(k === 1) return blob;
      const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      return await new Promise(ok => cv.toBlob(ok, "image/png"));
    }catch(e){ return blob; }
  },
  async ocr(blob){
    if(!window.Tesseract) await carregarScript(LIBS.tesseract);
    if(!this.worker) this.worker = await Tesseract.createWorker("por", 1, { langPath: LIBS.tesseractLang });
    const { data } = await this.worker.recognize(await this.reduzir(blob));
    return data.text || "";
  },
  async pdf(blob){
    if(!window.pdfjsLib){ await carregarScript(LIBS.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker; }
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    let txt = "";
    for(let n = 1; n <= Math.min(doc.numPages, 40) && txt.length < 20000; n++){
      const pg = await doc.getPage(n), c = await pg.getTextContent();
      txt += c.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("") + "\n";
    }
    // PDF escaneado (sem texto): lê as 3 primeiras páginas como imagem
    if(txt.replace(/\s/g, "").length < 20){
      txt = "";
      for(let n = 1; n <= Math.min(doc.numPages, 3); n++){
        const pg = await doc.getPage(n), vp = pg.getViewport({ scale: 2 });
        const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
        await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
        txt += await this.ocr(await new Promise(ok => cv.toBlob(ok, "image/png"))) + "\n";
      }
    }
    await doc.destroy();
    return txt;
  }
};

/* =====================================================================
   10. AGENDA DE ESTUDOS
   "Encaixar na agenda" cria um card na lista "Em andamento" da agenda,
   que é de onde sai a fila "Para encaixar". O checklist vira itens do card.
   A agenda fica em outro projeto do Supabase, com login próprio.
   ===================================================================== */
function dataLocal(d){ const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function quandoBloco(b){
  const hoje = dataLocal(new Date()), amanha = dataLocal(new Date(Date.now() + 864e5));
  const dia = b.date === hoje ? "hoje" : b.date === amanha ? "amanhã" : new Date(b.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "");
  return `${dia} ${String(Math.floor(b.start_min / 60)).padStart(2, "0")}:${String(b.start_min % 60).padStart(2, "0")}`;
}
const Agenda = {
  sb: null, sessao: null, ultima: 0,
  disponivel(){ return !!(CONFIG.agendaUrl && CONFIG.agendaKey) && !(window.claude && window.claude.use); },
  async cliente(){
    if(this.sb) return this.sb;
    if(!window.supabase) await carregarScript(LIBS.supabase);
    this.sb = window.supabase.createClient(CONFIG.agendaUrl, CONFIG.agendaKey, { auth: { storageKey: "caixa-agenda-sessao", persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    return this.sb;
  },
  async verSessao(){
    if(!this.disponivel()) return null;
    const sb = await this.cliente(); const { data } = await sb.auth.getSession();
    return (this.sessao = data.session);
  },
  async entrar(email, senha){
    const sb = await this.cliente();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if(error) throw error;
    this.sessao = data.session;
  },
  async sair(){ const sb = await this.cliente(); await sb.auth.signOut(); this.sessao = null; E.agenda = {}; },
  async encaixar(it, rascunho){
    if(!await this.verSessao()) throw new Error("sem_sessao");
    const { data: listas, error: el } = await this.sb.from("lists").select("id,name").eq("is_active", true).limit(1);
    if(el) throw el;
    const lista = listas[0]; if(!lista) throw new Error("sem_lista");
    const r = Object.assign({ titulo: it.titulo, texto: it.texto, url: it.url, checklist: it.checklist || [] }, rascunho || {});
    const linhas = String(r.texto || "").trim().split("\n");
    const titulo = (r.titulo || linhas[0] || (r.url ? tituloDeUrl(r.url) : "") || "Tarefa da Caixa").slice(0, 200);
    const resto = r.titulo ? String(r.texto || "").trim() : linhas.slice(1).join("\n").trim();
    const notas = [resto, r.url ? `[${hostDe(r.url)}](${r.url})` : "", "_Enviado da Caixa Pessoal_"].filter(Boolean).join("\n\n");
    const { data: ult } = await this.sb.from("cards").select("position").eq("list_id", lista.id).order("position", { ascending: false }).limit(1);
    const { data: card, error } = await this.sb.from("cards").insert({ title: titulo, list_id: lista.id, position: ((ult && ult[0] && ult[0].position) || 0) + 1024, notes: notas }).select("id").single();
    if(error) throw error;
    const ch = (r.checklist || []).filter(x => String(x.t).trim());
    if(ch.length){
      const { error: e2 } = await this.sb.from("items").insert(ch.map((x, k) => ({ card_id: card.id, title: String(x.t).slice(0, 300), position: (k + 1) * 1024, done: !!x.ok, done_at: x.ok ? agora() : null })));
      if(e2) console.warn("Itens do card:", e2);
    }
    if(r.url){ const { error: e3 } = await this.sb.from("attachments").insert({ card_id: card.id, kind: "link", name: (r.titulo || hostDe(r.url)).slice(0, 200), url: r.url }); if(e3) console.warn("Link do card:", e3); }
    it.agenda = { cardId: card.id, lista: lista.name, enviadoEm: agora() };
    salvarItem(it);
    E.agenda[card.id] = { texto: "Para encaixar", detalhe: `Na lista “${lista.name}” da agenda, esperando um horário` };
    return lista;
  },
  async atualizarStatus(seRecente){
    if(seRecente && Date.now() - this.ultima < 60000) return;
    const ids = [...new Set(E.itens.filter(i => i.agenda && ativo(i)).map(i => i.agenda.cardId))];
    if(!ids.length || !await this.verSessao()) return;
    this.ultima = Date.now();
    const [cards, blocos, listas] = await Promise.all([
      this.sb.from("cards").select("id,archived,completed_at,list_id").in("id", ids),
      this.sb.from("blocks").select("card_id,date,start_min,status").in("card_id", ids).eq("status", "planned").gte("date", dataLocal(new Date())).order("date").order("start_min"),
      this.sb.from("lists").select("id,is_done")
    ]);
    if(cards.error) throw cards.error;
    const concluidas = new Set((listas.data || []).filter(l => l.is_done).map(l => l.id));
    const st = {};
    for(const id of ids){
      const c = (cards.data || []).find(x => x.id === id);
      const b = (blocos.data || []).find(x => x.card_id === id);
      if(!c) st[id] = { texto: "Saiu da agenda", detalhe: "O card foi excluído na agenda" };
      else if(c.completed_at || concluidas.has(c.list_id)) st[id] = { texto: "Concluído", ok: true, concluido: true, detalhe: "Concluído na agenda" };
      else if(c.archived) st[id] = { texto: "Arquivado na agenda", detalhe: "O card foi arquivado na agenda" };
      else if(b) st[id] = { texto: quandoBloco(b), detalhe: "Horário marcado na agenda" };
      else st[id] = { texto: "Para encaixar", detalhe: "Esperando um horário em “Para encaixar” na agenda" };
    }
    E.agenda = st;
    // Concluído na agenda → feito na Caixa
    E.itens.filter(i => i.agenda && st[i.agenda.cardId] && st[i.agenda.cardId].concluido && !i.feito).forEach(i => { i.feito = true; i.feitoEm = agora(); salvarItem(i); });
    if(E.rota === "caixa") desenharQuadro();
  },
  pedirLogin(){
    return new Promise(ok => {
      let feito = false;
      const j = janela(`<div class="janela-topo"><h3>Entrar na agenda</h3><button class="ib" id="ag-x" aria-label="Fechar">${ico("x")}</button></div>
        <p style="margin:0 0 12px;color:var(--texto-2)">Use o mesmo e-mail e senha da Agenda de estudos. A Caixa guarda o acesso neste aparelho.</p>
        <form id="ag-f"><div class="campo"><label for="ag-e">E-mail</label><input type="email" id="ag-e" required autocomplete="email" value="${esc(Store.email || "")}"></div>
        <div class="campo"><label for="ag-s">Senha</label><input type="password" id="ag-s" required autocomplete="current-password"></div>
        <div class="erro" id="ag-erro"></div><div class="acoes"><span class="esp"></span><button class="bt pri">Entrar</button></div></form>`, () => ok(feito));
      j.el.querySelector("#ag-x").onclick = j.fechar;
      setTimeout(() => j.el.querySelector(j.el.querySelector("#ag-e").value ? "#ag-s" : "#ag-e").focus(), 50);
      j.el.querySelector("#ag-f").onsubmit = async ev => {
        ev.preventDefault();
        try{ await this.entrar(j.el.querySelector("#ag-e").value, j.el.querySelector("#ag-s").value); feito = true; j.fechar(); }
        catch(e){ j.el.querySelector("#ag-erro").textContent = erroLogin(e); }
      };
    });
  },
  explicar(e){
    const m = String(e && (e.message || e) || "");
    if(m === "sem_lista") return "Na agenda, marque uma lista como “Em andamento”: é dela que sai a fila Para encaixar.";
    if(m === "sem_sessao") return "Entre na agenda para enviar.";
    if(/failed to fetch|network/i.test(m)) return "Sem conexão com a agenda agora.";
    return "Não consegui enviar para a agenda: " + m;
  },
  desenharNoItem(it, box){
    if(!box) return;
    const c = colunaPor(it.colId);
    if(!it.agenda && !(c && c.tarefas)){ box.innerHTML = ""; return; }
    if(!this.disponivel()){ box.innerHTML = `<div class="caixa-ag">${ico("calendar", 1)}<div class="meio"><small>Encaixar na agenda funciona na versão do GitHub Pages.</small></div></div>`; return; }
    const pegarRascunho = () => {
      const j = box.closest(".janela"); if(!j) return null;
      const txt = j.querySelector("#j-txt").value, ch = separarChecklist(txt);
      const lista = [...j.querySelectorAll("#j-chk .l")].map(l => { const t = l.querySelector("[data-t]"), k = l.querySelector("[data-k]"); return t ? { t: t.value, ok: !!(k && k.checked) } : null; }).filter(Boolean);
      return { titulo: j.querySelector("#j-tit").value.trim(), texto: ch.checklist.length ? ch.resto : txt, url: j.querySelector("#j-url").value.trim(), checklist: [...lista, ...ch.checklist] };
    };
    if(it.agenda){
      const st = E.agenda[it.agenda.cardId];
      box.innerHTML = `<div class="caixa-ag">${ico("calendar", 1)}<div class="meio"><b>${esc(st ? st.texto : "Enviado para a agenda")}</b><br><small>${esc(st ? st.detalhe || "" : `Na lista “${it.agenda.lista || ""}” · ${dataBR(it.agenda.enviadoEm)}`)}</small></div>
        <a class="bt sec pq" href="${esc(CONFIG.agendaApp)}" target="_blank" rel="noopener">${ico("external", 1)}Abrir agenda</a></div>`;
      return;
    }
    box.innerHTML = `<div class="caixa-ag">${ico("calendar", 1)}<div class="meio"><b>Encaixar na agenda</b><br><small>Vai para a fila “Para encaixar”${(it.checklist || []).length ? ", com o checklist como itens" : ""}.</small></div><button class="bt pri pq" id="ag-env">${ico("enviar", 1)}Encaixar</button></div>`;
    box.querySelector("#ag-env").onclick = async () => {
      const b = box.querySelector("#ag-env"); b.disabled = true;
      try{
        if(!await this.verSessao() && !await this.pedirLogin()){ b.disabled = false; return; }
        const r = pegarRascunho();
        const lista = await this.encaixar(it, r);
        aviso(`Na agenda, em “${lista.name}” › Para encaixar`, { txt: "Abrir", fn: () => window.open(CONFIG.agendaApp, "_blank") });
        this.desenharNoItem(it, box);
        if(E.rota === "caixa") desenharQuadro();
      }catch(e){ console.error(e); aviso(this.explicar(e), null, 7000); b.disabled = false; }
    };
  },
  async desenharConfig(box){
    if(!box) return;
    if(!this.disponivel()){ box.innerHTML = `<p>A integração com a agenda funciona na versão publicada no GitHub Pages.</p>`; return; }
    box.innerHTML = `<p>Verificando…</p>`;
    let s = null; try{ s = await this.verSessao(); }catch(e){}
    if(s){
      const n = E.itens.filter(i => i.agenda && ativo(i)).length;
      box.innerHTML = `<p>Conectada como <b>${esc(s.user.email)}</b>. Na coluna de tarefas, cada item tem o botão “Encaixar na agenda”. ${n ? `${n} ${n === 1 ? "item já foi enviado" : "itens já foram enviados"}.` : ""}</p>
        <div class="acoes"><a class="bt sec pq" href="${esc(CONFIG.agendaApp)}" target="_blank" rel="noopener">${ico("external", 1)}Abrir agenda</a><button class="bt leve pq" id="ag-sair">Desconectar</button></div>`;
      box.querySelector("#ag-sair").onclick = async () => { await this.sair(); this.desenharConfig(box); };
    } else {
      box.innerHTML = `<p>Conecte para mandar tarefas da coluna “A fazer” direto para a fila “Para encaixar” da agenda, e ver aqui quando forem agendadas ou concluídas.</p><button class="bt pri pq" id="ag-con">${ico("calendar", 1)}Conectar agenda</button>`;
      box.querySelector("#ag-con").onclick = async () => { if(await this.pedirLogin()){ aviso("Agenda conectada"); this.desenharConfig(box); this.atualizarStatus().catch(() => {}); } };
    }
  }
};

/* =====================================================================
   11. AVISOS NO CELULAR (ideias paradas)
   O aparelho se inscreve para receber push; uma função do Supabase,
   rodada todo dia por um agendador, manda o aviso quando há ideias paradas.
   ===================================================================== */
function b64urlParaBytes(s){ const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
function bytesParaB64url(u8){ let b = ""; u8.forEach(x => b += String.fromCharCode(x)); return btoa(b).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
const Avisos = {
  suportado(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; },
  disponivel(){ return Store && Store.id === "supabase" && this.suportado(); },
  async inscricao(){ const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); },
  async ativar(){
    if(Instalar.ios() && !Instalar.instalado()) throw new Error("ios");
    const perm = await Notification.requestPermission();
    if(perm !== "granted") throw new Error("negado");
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlParaBytes(CONFIG.vapidPublica) });
    await Store.salvarInscricao(sub);
  },
  async desativar(){ const sub = await this.inscricao(); if(sub){ try{ await Store.removerInscricao(sub.endpoint); }catch(e){} await sub.unsubscribe(); } },
  async renovar(){
    if(!this.disponivel() || !CONFIG.vapidPublica || Notification.permission !== "granted") return;
    const sub = await this.inscricao(); if(sub) await Store.salvarInscricao(sub);
  },
  async gerar(){
    const k = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
    const pub = new Uint8Array(await crypto.subtle.exportKey("raw", k.publicKey));
    const jwk = await crypto.subtle.exportKey("jwk", k.privateKey);
    const seg = bytesParaB64url(crypto.getRandomValues(new Uint8Array(24)));
    return { publica: bytesParaB64url(pub), privada: jwk.d, segredo: seg };
  },
  explicar(e){
    const m = String(e && (e.message || e) || "");
    if(m === "ios") return "No iPhone, primeiro instale o app (Safari › Compartilhar › Adicionar à Tela de Início) e abra a Caixa pelo ícone.";
    if(m === "negado") return "As notificações estão bloqueadas para este site. Libere nas permissões do navegador e tente de novo.";
    if(/caixa_push|does not exist|PGRST205/i.test(m)) return "Falta rodar o supabase-caixa-v2.sql no SQL Editor do Supabase.";
    if(/not found|404|Function not found/i.test(m)) return "A função avisar-ideias-paradas ainda não foi publicada no Supabase.";
    return "Não deu certo: " + m;
  },
  async desenharConfig(box){
    if(!box) return;
    if(!(Store && Store.id === "supabase")){ box.innerHTML = `<p>O aviso no celular funciona na versão do GitHub Pages, com o Supabase. Aqui, as paradas aparecem no menu e numa faixa na Caixa.</p>`; return; }
    if(!this.suportado()){ box.innerHTML = `<p>Este navegador não recebe avisos. No celular, use o app instalado (Chrome no Android, Safari no iPhone).</p>`; return; }
    if(!CONFIG.vapidPublica){
      box.innerHTML = `<p><b>Avisos no celular:</b> falta uma configuração única no Supabase.</p><button class="bt pri pq" id="av-cfg">${ico("bell", 1)}Configurar avisos</button>`;
      box.querySelector("#av-cfg").onclick = () => this.assistente();
      return;
    }
    let sub = null; try{ sub = await this.inscricao(); }catch(e){}
    const ativo = sub && Notification.permission === "granted";
    box.innerHTML = `<p><b>Avisos neste aparelho:</b> ${ativo ? "ligados. O aviso chega uma vez por dia, de manhã, quando houver ideias paradas." : "desligados."}</p>
      <div class="acoes">${ativo ? `<button class="bt sec pq" id="av-teste">${ico("bell", 1)}Mandar um aviso de teste</button><button class="bt leve pq" id="av-off">Desligar</button>` : `<button class="bt pri pq" id="av-on">${ico("bell", 1)}Ligar avisos neste aparelho</button>`}<button class="bt leve pq" id="av-cfg">Refazer configuração</button></div>`;
    const on = box.querySelector("#av-on"); if(on) on.onclick = async () => { try{ await this.ativar(); aviso("Avisos ligados"); this.desenharConfig(box); }catch(e){ console.error(e); aviso(this.explicar(e), null, 8000); } };
    const off = box.querySelector("#av-off"); if(off) off.onclick = async () => { await this.desativar(); aviso("Avisos desligados"); this.desenharConfig(box); };
    const te = box.querySelector("#av-teste"); if(te) te.onclick = async () => { te.disabled = true; try{ const r = await Store.testarAviso(); aviso(r && r.enviados ? "Aviso enviado. Deve chegar em instantes." : "A função respondeu, mas nenhum aparelho recebeu. Desligue e ligue os avisos."); }catch(e){ console.error(e); aviso(this.explicar(e), null, 8000); } te.disabled = false; };
    box.querySelector("#av-cfg").onclick = () => this.assistente();
  },
  async assistente(){
    const k = await this.gerar();
    const url = (CONFIG.supabaseUrl || "").replace(/\/+$/, "") + "/functions/v1/avisar-ideias-paradas";
    const sql = `-- Roda a função todo dia às 9h (horário de Brasília = 12h UTC)
create extension if not exists pg_cron;
create extension if not exists pg_net with schema extensions;
select cron.unschedule(jobid) from cron.job where jobname = 'caixa-ideias-paradas';
select cron.schedule('caixa-ideias-paradas', '0 12 * * *', $$
  select net.http_post(
    url := '${url}',
    headers := jsonb_build_object('Content-Type', 'application/json', 'x-caixa-segredo', '${k.segredo}'),
    body := '{}'::jsonb
  );
$$);`;
    const bloco = (rot, val, id) => `<div class="campo" style="margin-bottom:6px"><label>${rot}</label><div class="codigo" id="${id}">${esc(val)}</div><button class="bt sec pq" data-cp="${id}" style="align-self:flex-start">${ico("copy", 1)}Copiar</button></div>`;
    const j = janela(`<div class="janela-topo"><h3>Configurar avisos de ideias paradas</h3><button class="ib" id="as-x" aria-label="Fechar">${ico("x")}</button></div>
      <p style="margin:0 0 12px;color:var(--texto-2)">Gerei agora as chaves do seu app. Elas aparecem só nesta tela: siga os passos antes de fechar. A chave privada e o segredo vão só para o Supabase, nunca para o GitHub.</p>
      <ol class="passos">
        <li>No Supabase, rode o arquivo <b>supabase-caixa-v2.sql</b> no SQL Editor (cria a tabela dos aparelhos).</li>
        <li>Em <b>Edge Functions › Secrets</b>, crie estes quatro segredos:
          ${bloco("VAPID_PUBLIC_KEY", k.publica, "as-pub")}${bloco("VAPID_PRIVATE_KEY", k.privada, "as-priv")}${bloco("CAIXA_CRON_SEGREDO", k.segredo, "as-seg")}
          <div class="campo"><label>VAPID_SUBJECT</label><div class="codigo">mailto:${esc(Store.email || "seu-email@exemplo.com")}</div></div></li>
        <li>Em <b>Edge Functions › Deploy a new function › Via Editor</b>, dê o nome <b>avisar-ideias-paradas</b>, cole o conteúdo do arquivo <b>supabase/functions/avisar-ideias-paradas/index.ts</b> e publique. Depois, nos detalhes da função, desligue <b>Verify JWT</b> (a função confere o acesso sozinha).</li>
        <li>No SQL Editor, rode este agendador:${bloco("SQL do agendador", sql, "as-sql")}</li>
        <li>No <b>index.html</b>, seção 3, cole a chave pública em <b>vapidPublica</b>:${bloco("vapidPublica", k.publica, "as-pub2")} Depois faça commit e push.</li>
        <li>Abra a Caixa instalada no celular › Configurações › <b>Ligar avisos neste aparelho</b> › <b>Mandar um aviso de teste</b>.</li>
      </ol>`);
    j.el.querySelector("#as-x").onclick = j.fechar;
    j.el.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copiar(j.el.querySelector("#" + b.dataset.cp).textContent, "Copiado"));
  }
};

/* =====================================================================
   12. INICIALIZAÇÃO
   ===================================================================== */
preencherIcones();
Instalar.registrar();
window.addEventListener("hashchange", irPara);
(async function iniciar(){
  await iniciarArmazenamento();
  $("#modo-txt").textContent = Store.nome;
  let docs = [];
  try{ docs = await Store.carregar(); }
  catch(e){ console.error(e); main.innerHTML = `<div class="carregando"><div>Não consegui abrir sua caixa agora.<br><small style="display:block;max-width:440px;margin:8px auto 0;font-size:12px">${esc(explicarErro(e))}</small><button class="bt sec" style="margin-top:12px" onclick="location.reload()">Tentar de novo</button></div></div>`; return; }
  E.colunas = docs.filter(d => d.tipo === "coluna");
  E.itens = docs.filter(d => d.tipo === "item");
  E.meta = docs.find(d => d.tipo === "meta") || null;
  if(!E.meta){
    const nova = !E.colunas.length && !E.itens.length;
    E.meta = { id: Store.metaId(), tipo: "meta", diasParada: 7, versao: 2 };
    if(nova){
      COLUNAS_PADRAO.forEach((c, k) => salvarColuna({ id: novoId("c"), tipo: "coluna", ordem: k + 1, oculta: false, ...c }));
    } else {
      // Atualização: cria a coluna "A fazer" e liga o aviso de parada nas colunas de ideias
      if(!E.colunas.some(c => c.tarefas)) salvarColuna({ id: novoId("c"), tipo: "coluna", ordem: Math.max(0, ...E.colunas.map(c => c.ordem)) + 1, oculta: false, ...COLUNA_AFAZER() });
      E.colunas.filter(c => c.destino === "texto" && c.avisarParada === undefined).forEach(c => { c.avisarParada = true; salvarColuna(c); });
    }
    salvar(E.meta);
  }
  irPara();
  limparLixeiraVencida().catch(() => {});
  Agenda.atualizarStatus().catch(e => console.warn("Agenda:", e));
  Avisos.renovar().catch(e => console.warn("Avisos:", e));
})();
</script>
